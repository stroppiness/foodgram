server {
  listen 80;
  server_tokens off;
  client_max_body_size 5M;
  server_name foodgrams.duckdns.org;
  index index.html;

  location /api/ { 
    proxy_set_header Host $http_host; 
    proxy_pass http://foodgram_backend:8000/api/; 
  } 

  location /admin/ { 
    proxy_set_header Host $http_host; 
    proxy_pass http://foodgram_backend:8000/admin/; 
  } 
  
  location /api/docs/ {
    alias /usr/share/nginx/html/api/docs/;
    index redoc.html;
}

location /static/ {
    alias /static/static/;
}

location / {
  alias /static/;
  try_files $uri $uri/ /index.html;
}

location /media/ {
      alias /media/;
  }
}